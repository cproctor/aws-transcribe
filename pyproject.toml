[tool.poetry]
name = "aws-transcribe"
version = "0.1.0"
description = "Interface to AWS transcription"
authors = ["Chris Proctor <github.com@accounts.chrisproctor.net>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
boto3 = "^1.26.11"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
transcribe = "transcribe:main"
